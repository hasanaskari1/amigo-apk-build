{"name":"Build iOS TestFlight","on":{"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"macos-26","timeout-minutes":90,"steps":[{"uses":"actions/checkout@v4"},{"name":"Assemble source","run":"cat amigo-src.part-* > src.zip && unzip -o -q src.zip && rm src.zip"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"name":"Install JS deps","working-directory":"frontend","run":"npm install --legacy-peer-deps --no-audit --no-fund"},{"name":"Pod install","working-directory":"frontend/ios","run":"pod install || (pod repo update && pod install)"},{"name":"Signing setup","run":"security create-keychain -p ci build.keychain && security default-keychain -s build.keychain && security unlock-keychain -p ci build.keychain && security set-keychain-settings -t 3600 build.keychain && security import dist.p12 -k build.keychain -P amigoci2026 -T /usr/bin/codesign && security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain && mkdir -p \"$HOME/Library/MobileDevice/Provisioning Profiles\" && cp profile.mobileprovision \"$HOME/Library/MobileDevice/Provisioning Profiles/\""},{"name":"Archive","working-directory":"frontend/ios","run":"xcodebuild -workspace Amigo.xcworkspace -scheme Amigo -configuration Release -destination \"generic/platform=iOS\" -archivePath build/Amigo.xcarchive archive DEVELOPMENT_TEAM=X3957LKCS9 CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER=\"Amigo AppStore CI\" \"CODE_SIGN_IDENTITY=Apple Distribution\""},{"name":"Export IPA","working-directory":"frontend/ios","run":"xcodebuild -exportArchive -archivePath build/Amigo.xcarchive -exportPath build/export -exportOptionsPlist ../../exportOptions.plist"},{"name":"Upload to TestFlight","run":"xcrun altool --upload-app -f \"$(ls frontend/ios/build/export/*.ipa | head -1)\" -t ios -u rakhshanz@smartspheretechnologies.com -p \"${{ secrets.APPLE_APP_PASSWORD }}\""},{"uses":"actions/upload-artifact@v4","with":{"name":"amigo-ipa","path":"frontend/ios/build/export/*.ipa","retention-days":7}}]}}}
