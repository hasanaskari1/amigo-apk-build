{"name":"Build Amigo AAB","on":{"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Assemble source","run":"cat amigo-src.part-* > src.zip && unzip -o -q src.zip && rm src.zip"},{"name":"Write signing config from secret","run":"printf '%s\\n' \"${{ secrets.KEYSTORE_PROPERTIES }}\" > frontend/android/keystore.properties && test -s frontend/android/keystore.properties && echo 'keystore.properties written' && grep -c storePassword frontend/android/keystore.properties"},{"name":"Patch TextDecoder polyfill (utf-16le)","working-directory":"frontend","run":"echo aW1wb3J0IHsgVGV4dEVuY29kZXIsIFRleHREZWNvZGVyIH0gZnJvbSAnQHp4aW5nL3RleHQtZW5jb2RpbmcnOwpnbG9iYWwuVGV4dEVuY29kZXIgPSBUZXh0RW5jb2RlcjsKZ2xvYmFsLlRleHREZWNvZGVyID0gVGV4dERlY29kZXI7 | base64 --decode > polyfills.js && { echo aW1wb3J0ICcuL3BvbHlmaWxscyc7 | base64 --decode; echo; cat index.js; } > _idx.js && mv _idx.js index.js && echo ---PATCHED-INDEX--- && head -6 index.js"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"name":"Patch client changes (media cache + drafts + doc fix)","working-directory":"frontend","run":"node ../patch_client_changes.js"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Install JS dependencies","working-directory":"frontend","run":"npm install --legacy-peer-deps --no-audit --no-fund && npm install @zxing/text-encoding@0.9.0 --legacy-peer-deps --no-audit --no-fund"},{"name":"Make gradlew executable","working-directory":"frontend/android","run":"chmod +x gradlew"},{"name":"Build SIGNED release AAB","working-directory":"frontend/android","run":"./gradlew bundleRelease --no-daemon --stacktrace"},{"name":"Collect AAB","run":"mkdir -p out && cp $(ls frontend/android/app/build/outputs/bundle/release/*.aab | head -1) out/Amigo-signed.aab && ls -la out"},{"uses":"actions/upload-artifact@v4","with":{"name":"amigo-aab-signed","path":"out/Amigo-signed.aab","retention-days":7}}]}}}