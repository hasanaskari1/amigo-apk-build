{"name":"Build Amigo AAB","on":{"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Assemble source","run":"cat amigo-src.part-* > src.zip && unzip -o -q src.zip && rm src.zip"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Install JS dependencies","working-directory":"frontend","run":"npm install --legacy-peer-deps --no-audit --no-fund"},{"name":"Make gradlew executable","working-directory":"frontend/android","run":"chmod +x gradlew"},{"name":"Build UNSIGNED release AAB","working-directory":"frontend/android","run":"./gradlew bundleRelease -PunsignedRelease --no-daemon --stacktrace"},{"name":"Collect AAB","run":"mkdir -p out && cp $(ls frontend/android/app/build/outputs/bundle/release/*.aab | head -1) out/Amigo-ghostonly-unsigned.aab && ls -la out"},{"uses":"actions/upload-artifact@v4","with":{"name":"amigo-aab","path":"out/Amigo-ghostonly-unsigned.aab","retention-days":7}}]}}}
