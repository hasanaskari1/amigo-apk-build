{"name":"Build Amigo APK","on":{"push":{},"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Assemble source","run":"cat amigo-src.part-* > src.zip && unzip -q src.zip && rm src.zip && echo reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 >> frontend/android/gradle.properties && grep -n reactNativeArchitectures frontend/android/gradle.properties && ls -la"},{"name":"Patch TextDecoder polyfill (utf-16le)","working-directory":"frontend","run":"echo aW1wb3J0IHsgVGV4dEVuY29kZXIsIFRleHREZWNvZGVyIH0gZnJvbSAnQHp4aW5nL3RleHQtZW5jb2RpbmcnOwpnbG9iYWwuVGV4dEVuY29kZXIgPSBUZXh0RW5jb2RlcjsKZ2xvYmFsLlRleHREZWNvZGVyID0gVGV4dERlY29kZXI7 | base64 -d > polyfills.js && { echo aW1wb3J0ICcuL3BvbHlmaWxscyc7 | base64 -d; echo; cat index.js; } > _idx.js && mv _idx.js index.js && echo ---PATCHED-INDEX--- && head -6 index.js"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"name":"Patch client changes (Ghost media UI + no login)","working-directory":"frontend","run":"node ../patch_client_changes.js"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Install JS deps","working-directory":"frontend","run":"npm install --legacy-peer-deps --no-audit --no-fund && npm install @zxing/text-encoding@0.9.0 --legacy-peer-deps --no-audit --no-fund"},{"name":"Build release APK","working-directory":"frontend/android","run":"chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace"},{"name":"Collect APK","run":"cp frontend/android/app/build/outputs/apk/release/app-release.apk Amigo-fixed.apk && ls -la Amigo-fixed.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"amigo-apk","path":"Amigo-fixed.apk","retention-days":7}}]}}}
